[project]
name = "spectra-peel-tiger-export"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
  "torch==2.5.1",
  "numpy==1.26.4",
  "librosa==0.10.2.post1",
  "torch-complex==0.4.4",
  "typeguard==2.13.3",
  "huggingface_hub==0.26.2",
  "safetensors==0.4.5",
  "packaging==24.2",
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  # look2hear.utils imports these even though export uses neither.
  "rich==13.9.4",
  "pytorch-lightning==2.4.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
