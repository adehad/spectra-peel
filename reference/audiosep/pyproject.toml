[project]
name = "spectra-peel-audiosep-export"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.9.1",
  "torchlibrosa==0.1.0",
  "transformers==4.57.6",
  "numpy==2.5.4",
  "huggingface_hub==0.36.2",
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
  "onnxsim==0.8.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
