[project]
name = "spectra-peel-official-dfn3"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
  "deepfilternet==0.5.6",
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
  "onnx==1.17.0",
  "scipy==1.13.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
